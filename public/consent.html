<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authorize Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
  <link rel="stylesheet" href="/css/consent.css" />
</head>
<body>
  <main class="page-center" role="main">
    <div class="card consent-card" id="consentCard">

      <div class="app-header">
        <div class="app-icon" id="appIcon" aria-hidden="true">
          <span id="appInitials">A</span>
        </div>
        <div class="app-meta">
          <h1 class="app-name" id="appName">Application</h1>
          <a class="app-url" id="appUrl" href="#" target="_blank" rel="noopener noreferrer">app.example.com</a>
        </div>
      </div>

      <p class="consent-intro">
        This application is requesting access to your <strong>AuthForge</strong> account.
      </p>

      <div class="user-pill" aria-label="Signed in account">
        <div class="user-avatar" aria-hidden="true" id="userAvatar">U</div>
        <span class="user-email" id="userEmail">user@example.com</span>
        <svg class="user-verified" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="Verified account">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
      </div>

      <div class="permissions-section">
        <p class="permissions-label">This application will be able to:</p>
        <ul class="permissions-list" id="permissionsList" role="list">
        </ul>
      </div>

      <div class="security-note" role="note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>Your password and credentials are never shared with third-party applications.</span>
      </div>

      <div id="alertBox" class="alert alert-error" style="display:none" role="alert"></div>

      <div class="actions">
        <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
        <button type="button" class="btn btn-primary" id="allowBtn">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">Allow Access</span>
        </button>
      </div>

    </div>
  </main>

  <script src="/js/consent.js"></script>
</body>
</html>
